name: Release PonWrt

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
      prerelease:
        description: Mark as prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: release
    strategy:
      fail-fast: false
      matrix:
        target:
          - an7581

    steps:
      - uses: actions/checkout@v6

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-${{ matrix.target }}-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-${{ matrix.target }}-

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add custom LuCI apps
        run: |
          mkdir -p package/custom
          git clone --depth 1 \
            https://github.com/luanmuc/luci-app-airoha-npu.git \
            package/custom/luci-app-airoha-npu
          git clone --depth 1 https://github.com/qwe3017/luci-app.git /tmp/qwe3017-luci-app
          cp -r /tmp/qwe3017-luci-app/luci-app-natmode package/custom/luci-app-natmode
          cp -r /tmp/qwe3017-luci-app/luci-app-pon-status package/custom/luci-app-pon-status

      - name: Add rtp2httpd LuCI app
        run: |
          git clone --depth 1 https://github.com/stackia/rtp2httpd.git /tmp/rtp2httpd
          mkdir -p package/custom
          cp -r /tmp/rtp2httpd/openwrt-support/luci-app-rtp2httpd package/custom/luci-app-rtp2httpd

      - name: Load repository signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            umask 077
            printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > private-key.pem
            openssl ec -in private-key.pem -pubout -out public-key.pem
          fi

      - name: Configure ${{ matrix.target }}
        run: |
          ./scripts/kconfig.pl + \
            "configs/${{ matrix.target }}.config" \
            configs/release.config > .config
          make defconfig

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build ${{ matrix.target }}
        run: make -j"$(nproc)"

      - name: Collect ${{ matrix.target }} images
        run: |
          set -e
          src="bin/targets/airoha/${{ matrix.target }}"
          mkdir -p release
          find "$src" -maxdepth 1 -type f \
            \( -name '*.itb' -o -name '*.bin' \) \
            -exec cp -v {} release/ \;
          rm -f release/kernel.bin
          if [ -z "$(ls -A release)" ]; then
            echo "no firmware images found in $src" >&2
            exit 1
          fi
          ls -lh release

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download firmware images
        uses: actions/download-artifact@v4
        with:
          pattern: ponwrt-*
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: |
          ls -lh
          shopt -s nullglob
          files=(*.itb *.bin)
          sha256sum "${files[@]}" > sha256sums
          cat sha256sums

      - name: Write release notes
        working-directory: release
        run: |
          set -e
          cat > release-notes.md <<'EOF'
          ## 固件说明

          本固件基于 PonWrt，支持以下机型：

          - Nokia XG-040G-MD UBI
          - Nokia XG-040G-TF UBI
          - UnionMan UNG00A
          - ZNXT ZN504XG-D

          每台机型对应两个可直接刷写的镜像，**无需解压**：

          - `*-sysupgrade.itb`：系统升级镜像，用于 Web 界面升级或 UBI 写入
          - `*-recovery.itb`：恢复镜像，用于救砖或首次刷写

          ## 已添加插件

          - luci-app-upnp（UPnP）
          - luci-app-iptv（IPTV 桥接配置）
          - luci-app-natmode（NAT 类型选择：全锥形/受限型/对称型）
          - luci-app-pon-status（PON 光模块状态）
          - luci-app-homeproxy（代理客户端，支持 TProxy 透明代理）
          - sing-box（HomeProxy 代理内核）
          - rtp2httpd（RTP/RTSP 组播转 HTTP 单播）
          - luci-app-rtp2httpd（rtp2httpd 管理界面）
          - luci-app-vlmcsd（KMS 服务器）
          - luci-app-wol（网络唤醒）
          - luci-app-ttyd（网页终端）
          - luci-app-airoha-npu（Airoha NPU 状态监控）
          - openssh-sftp-server（OpenSSH SFTP 服务）
          - curl
          EOF

          {
            echo ""
            echo "## 本次固件文件"
            echo ""
            for f in *.itb *.bin; do
              [ -e "$f" ] || continue
              echo "- \`$f\` ($(du -h "$f" | cut -f1))"
            done
          } >> release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(
            "$RELEASE_TAG"
            release/*.itb
            release/sha256sums
            --notes-file release/release-notes.md
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "PonWrt $RELEASE_TAG"
          )
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
